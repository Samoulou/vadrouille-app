<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>DayBadge</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--page)}
.row{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-5)}
.tab{min-height:44px;padding:0 var(--space-2);border:none;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink-soft)}
.tab.on{color:var(--ink);font-weight:800;border-bottom:3px solid var(--line)}
.badge{min-width:44px;height:44px;padding:0 var(--space-2);border:1.5px solid var(--outline-strong);border-radius:var(--radius-badge);background:var(--raised);font:inherit;font-size:15px;font-weight:800;color:var(--ink)}
.badge.on{background:var(--line);border-color:var(--line);color:var(--on-line)}
</style></head>
<body>
<div id="root" class="row">
<button class="tab">Aperçu</button>
<button class="badge">J1</button>
<button class="badge on" aria-current="true">J2</button>
<button class="badge">J3</button>
<button class="badge">J4</button>
</div>
</body>
</html>
