<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>ReasonBlock</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--page)}
.wrap{max-width:390px;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2)}
.block{border-radius:var(--radius-block);padding:14px 16px;background:var(--muted);display:flex;flex-direction:column;gap:6px}
.block b{font-size:15px;line-height:20px;font-weight:800}
.block p{margin:0;font-size:15px;line-height:22px;color:var(--ink-2)}
.block a{min-height:32px;display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.meta{font-size:13px;line-height:18px;color:var(--ink-soft)}
</style></head>
<body>
<div id="root" class="wrap">
<div class="block"><b>Pourquoi pour toi</b><p>Tu as choisi Histoire et Balades en ville. Ancien village de meuniers au bord de la Water of Leith, calme le matin.</p><a href="#">Source : [site de l'office du tourisme]</a></div>
<div class="meta">Infos vérifiées le [date].</div>
</div>
</body>
</html>
