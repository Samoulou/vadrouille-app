<!-- @dsCard group="Statuts" height=88 subtitle="À réserver, à confirmer, non confirmé, compteur" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Tag</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--page)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-3);padding:var(--space-5)}
.tag{height:24px;padding:0 8px;box-sizing:border-box;border-radius:var(--radius-tag);font-size:12px;line-height:24px;font-weight:700}
.act{background:var(--quai);color:var(--on-quai)}
.unsure{border:1.5px dashed var(--ink);line-height:21px;color:var(--ink)}
.count{display:flex;align-items:center;gap:var(--space-2);font-size:20px;line-height:26px;font-weight:800}
.count span{height:24px;min-width:24px;padding:0 6px;box-sizing:border-box;border-radius:var(--radius-tag);background:var(--quai);color:var(--on-quai);font-size:13px;line-height:24px;text-align:center}
</style></head>
<body>
<div id="root" class="row">
<span class="tag act">À réserver</span>
<span class="tag unsure">Horaire à confirmer</span>
<span class="tag unsure">Non confirmé</span>
<span class="count">À faire avant de partir <span>4</span></span>
</div>
</body>
</html>
