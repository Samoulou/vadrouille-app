name: visual-update
# Régénère les références visuelles Playwright sur la CI (décision 0004, option C, et sa section « Évolution »).
# - Déclencheur : libellé `update-snapshots` posé sur une PR ouverte. Jamais `pull_request_target`.
# - Garde-fous : branche de tête `claude/…` de ce même dépôt ; une PR venue d'un fork ne lance rien
#   (son jeton serait de toute façon en lecture seule).
# - Même environnement que le job `verify` de ci.yml : ubuntu-latest, Node 22, pnpm du champ packageManager,
#   Chromium et polices système installés par `playwright install --with-deps chromium` à la version figée
#   dans pnpm-lock.yaml (décision 0003).
# - Le code de la PR (installation, build, tests) s'exécute sans jeton en écriture : `persist-credentials: false`,
#   et le jeton n'est passé qu'aux étapes de commit, de push et de libellés, qui n'exécutent que ce fichier.
# - Un seul commit `[qa] chore: références visuelles régénérées (0004)`, limité à tests/visual/__screenshots__/ ;
#   aucun commit si rien ne change. Le libellé est retiré à la fin, que le job réussisse ou non.
# - Un push fait avec GITHUB_TOKEN ne relance ni `ci` ni `techlead-gate` : le job retire lui-même
#   `techlead-approved` (règle « chaque nouveau push », 0023 § 4.4) et l'agent de la PR pousse ensuite un commit,
#   même vide, pour relancer la CI (0004, « Évolution »).
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: visual-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.event.label.name == 'update-snapshots' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Révision exacte de la PR au moment du libellé : si la branche avance pendant le job, le push est refusé
      # (non fast-forward) au lieu de committer des images prises sur une autre révision.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (= v4, comme ci.yml)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= v4, comme ci.yml)
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `--update-snapshots=all` et non `pnpm test:visual:update` (mode `changed`) : une capture dont l'écart reste
      # sous la tolérance de 1 % est aussi réécrite (Q232, F2c-Q4). Tolérance et specs inchangées (0004, point 5).
      - name: Régénérer les références visuelles
        run: pnpm exec playwright test --project=visual --update-snapshots=all
      - id: changes
        name: Vérifier que seules des références ont changé
        run: |
          git status --porcelain --untracked-files=all > changes.txt
          cat changes.txt
          if grep -vqE '^.. tests/visual/__screenshots__/[^/]+\.png$' changes.txt; then
            echo "::error::Fichiers modifiés hors de tests/visual/__screenshots__/ : rien n'est poussé (décision 0004, point 4)."
            exit 1
          fi
          if [ -s changes.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune référence modifiée : aucun commit."
          fi
          rm changes.txt
      - if: steps.changes.outputs.changed == 'true'
        name: Committer et pousser sur la branche de la PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898073+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__/
          git commit -m "[qa] chore: références visuelles régénérées (0004)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
      - if: steps.changes.outputs.changed == 'true'
        name: Retirer techlead-approved et signaler le commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 404 si le libellé n'était pas posé : sans effet.
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/techlead-approved" > /dev/null 2>&1 || true
          {
            echo "visual-update : références régénérées sur la CI, commit \`$(git rev-parse --short=7 HEAD)\` (décision 0004)."
            echo
            git show --name-status --format= HEAD | sed 's/^/- /'
            echo
            echo "Ce push, fait avec GITHUB_TOKEN, ne relance pas \`ci\` ni \`techlead-gate\` :"
            echo "pousse un commit (même vide) sur la branche pour les relancer. \`techlead-approved\` a été retiré."
          } > comment.md
          gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
      - if: failure()
        name: Envoyer les résultats de test en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (= v4, comme ci.yml)
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        name: Retirer le libellé update-snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 404 si une exécution concurrente l'a déjà retiré : sans effet.
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/update-snapshots" > /dev/null 2>&1 || true
