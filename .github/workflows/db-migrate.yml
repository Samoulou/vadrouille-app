name: db-migrate
# Application des migrations à la base réelle (décision 0056, exigence Sécurité S9 révisée ; Q294 : « Bouton GitHub »).
# - N'applique que les migrations dont le nom et l'empreinte SHA-256 figurent dans MIGRATIONS_APPROUVEES, plus bas,
#   que seul Samuel approuve (owner-approved, décision 0035). Tout le reste est refusé. La liste est la seule source
#   des noms de migration : le journal de drizzle-kit n'est pas lu.
# - Aucun fichier du dépôt n'est exécuté ni chargé : bash, sha256sum, stat, realpath et psql -X du runner. Le texte
#   d'une migration est lu une fois, haché, comparé à la liste, puis seulement envoyé par un -c de psql.
# - Lancé à la main sur main, avec sha_attendu = tête de main relevée juste avant (§ 2.9) ; le lanceur consigne la
#   conclusion du run, le commit et les migrations appliquées et ignorées dans le ticket ou la PR, sans valeur secrète.
# - Environnement db-migrate (branche main seule) et secrets MIGRATOR_PG* posés par Samuel (Q387) ; MIGRATOR_PGHOST
#   désigne l'hôte direct de Neon, jamais l'hôte poolé. Aucun agent ne modifie l'environnement ni ses secrets.
# - Un run en attente dans le groupe db-migrate est annulé par GitHub si un autre lancement arrive : le lanceur
#   vérifie la conclusion de son run et relance s'il a été annulé (§ 2.7).
# - Lot partiel (§ 2.6.4) : chaque migration a sa session et sa transaction ; les migrations appliquées avant un échec
#   restent journalisées. Aucun nouveau lancement avant l'analyse de la Sécurité et du data.
# Fichier sous .github/workflows/ : owner-approved posé par Samuel (décision 0035).
on:
  workflow_dispatch:
    inputs:
      sha_attendu:
        description: "Commit de main relevé juste avant le lancement (40 caractères hexadécimaux)"
        required: true
        type: string
permissions: {}
concurrency:
  group: db-migrate
  cancel-in-progress: false
jobs:
  migrer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: db-migrate
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Appliquer les migrations approuvées
        shell: bash
        env:
          SHA_ATTENDU: ${{ inputs.sha_attendu }}
          LC_ALL: C
          PGHOST: ${{ secrets.MIGRATOR_PGHOST }}
          PGDATABASE: ${{ secrets.MIGRATOR_PGDATABASE }}
          PGPASSWORD: ${{ secrets.MIGRATOR_PGPASSWORD }}
          PGUSER: vadrouille_migrator
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
          # Textes SQL de l'exécuteur, envoyés par des -c distincts (§ 2.6.2 à 2.6.4). @TAG@ et @SHA256@ sont remplacés
          # par une ligne de la liste, vérifiée par son motif (aucune apostrophe possible).
          SQL_SESSION: "SET search_path = pg_catalog, pg_temp"
          SQL_ROLE: |
            DO $$
            BEGIN
              IF session_user <> 'vadrouille_migrator' OR current_user <> 'vadrouille_migrator' THEN RAISE EXCEPTION 'rôle de session inattendu'; END IF;
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles r WHERE r.rolname = 'vadrouille_migrator' AND (r.rolsuper OR r.rolbypassrls)) THEN RAISE EXCEPTION 'rôle privilégié'; END IF;
            END
            $$
          SQL_JOURNAL: "CREATE TABLE IF NOT EXISTS vadrouille_migrations.applied (tag text PRIMARY KEY, sha256 text NOT NULL, applied_at timestamptz NOT NULL DEFAULT now())"
          SQL_LIRE_JOURNAL: "SELECT a.tag, a.sha256 FROM vadrouille_migrations.applied a ORDER BY a.tag"
          SQL_DELAIS: "SET lock_timeout = '10s'; SET statement_timeout = '5min'"
          SQL_VERROU: "SELECT pg_catalog.pg_advisory_xact_lock(pg_catalog.hashtext('vadrouille_migrations'))"
          SQL_REPERE: "SELECT pg_catalog.set_config('vadrouille_migrate.txid', pg_catalog.txid_current()::text, true)"
          SQL_NON_APPLIQUEE: |
            DO $$
            BEGIN
              IF EXISTS (SELECT 1 FROM vadrouille_migrations.applied a WHERE a.tag = '@TAG@') THEN RAISE EXCEPTION 'migration déjà journalisée'; END IF;
            END
            $$
          SQL_APRES_CHEMIN: "SET LOCAL search_path = pg_catalog, pg_temp"
          SQL_APRES: |
            DO $$
            BEGIN
              IF session_user <> 'vadrouille_migrator' OR current_user <> 'vadrouille_migrator' THEN RAISE EXCEPTION 'rôle changé par la migration'; END IF;
              IF pg_catalog.current_setting('session_replication_role') <> 'origin' THEN RAISE EXCEPTION 'session_replication_role changé par la migration'; END IF;
              IF pg_catalog.current_setting('vadrouille_migrate.txid', true) IS DISTINCT FROM pg_catalog.txid_current()::text THEN RAISE EXCEPTION 'transaction changée par la migration'; END IF;
            END
            $$
          SQL_INSERER: "INSERT INTO vadrouille_migrations.applied (tag, sha256) VALUES ('@TAG@', '@SHA256@')"
        run: |
          set -u
          echec() {
            printf 'Échec : %s\n' "$1"
            exit 1
          }

          # Liste d'approbation (§ 2.4) : une ligne « <tag> <sha256> » par migration, dans l'ordre du journal, en ajout
          # seulement. Chaque ajout est une PR de workflow qui attend owner-approved, avec le verdict Sécurité G1 à G6.
          MIGRATIONS_APPROUVEES=(
            "0000_socle ec0a86eff5924456d3bcef6ebfa9512ced902c8612fd34392fac562b61983158"
            "0001_securite acd8f95df0c27d1e8bfb3f722bd4d02b4943a3ebf1e0c8bb9aa08a972c4b2f6a"
            "0002_place_coordinates 5d88c571a20c220bceada1aeddfe6818b8a075db06f6e6989685b1257aa62006"
            "0003_prototype e75ab97b8cd8dfbac73e909cbe79153c051cc92ecfa97936b6297e715ecde843"
            "0004_rate_limit_expires_at f637564fe843325e9afe70c6f017680616c0bff098a8304d9502e8c8c8f2352d"
            "0005_prototype_coordinates_run fe1a524fca2816ad76a09b75baff36770234f653c9c2d9ce9cd7af5a0bfb4145"
            "0006_deverrouillage_positions_prototype 5db869668d67397556d2f1c2393923c920f6afb0f1f5cef83618de32ca2f57ca"
            "0007_essais_sans_limite 45500cc79d744eb25a995c8c03ae54570e1074e3e3a158f6c2dfbbbc866fa018"
            "0008_positions_mvp_29_jours d80a2a37347ce3ae6bb9a1785ee104086b76bd0c13f416b81aa27a08e949a7d8"
            "0009_verifications_updated_at 62d8c1c53aee6011a14a1e35692de301b7d025c5a143198b5a41acd2bb76110b"
            "0010_usage_forfait 78adfbeedf665e62f7da2e2b0d5f43b3c2fdfc837f5a06f9399fbb58d228bfa0"
            "0011_trajets_prototype 9b71af4cd968128ec3696027e6a0592d8489cddc9eaf4c329cf1f6e188107280"
            "0012_creation_voyage 56d9d03e7b0f76c99d276c3586284aaee3ee0f7737645dc3b08e3436f60f5faf"
            "0013_secteurs_prototype 2d9704d887148efb7a679d6ed0b126a8cdcad81b932617f51e60496238b48963"
            "0014_tri_enregistre 0fc7b497a023c71d5bce285961745e6a095aad157198f593241a2a56ee1d1088"
            "0015_recalcul_lot 167240921a3bfc87e5c087bccbd5c33d6e33e5d604f7686f1e6711597bff9026"
            "0016_restriction_update_generation_runs f2f36d78483151ff7553cd507e328d1c7508a599cbd6c64c02a484ca415edea5"
            "0017_brief_saisi_prototype 72a428bfc9305b380f74870953f3106b356eff47811b785f928c58ead7927376"
            "0018_brief_saisi_a_eviter 4f35ef1f3e72026a12eee137a9f3cb90ebf88b582f7a8b6283b7aba65b07e3c2"
            "0019_recherche_ville_prototype 6a45a7600bd9b4d87c593bd0999f4a56fcf7dca1250df1362ef50db8aa237853"
            "0020_plafond_emails 65f78796c09dbd26f9b9a94b7ff60f00d09d7d6b05d2d328c30bc43250c4a50f"
            "0021_compteurs_autocompletion a6fb3e4ac7dc8bcdd29aa17343df4ab1f4615e57abe58131c2fba96db7fa2374"
            "0022_feedback_signalements 44ea9ca8672b6870114f39eab838ce3c88a2f3c2adcc1f63a1753588bb966590"
            "0023_lien_prive_partage 1e5ba834a4cb3da1c1927c83b468150adbcea6e62b9d4d672754f2b55103b3e1"
            "0024_rappels 5218eb24815f22d36ef8f9e27dfc2fcbc2a6199381cead93c8a20964be349248"
          )

          # 1. Contrôles, sans connexion (§ 2.6.1). Un échec n'affiche que le nom du contrôle, jamais une valeur.
          if [[ ! $SHA_ATTENDU =~ ^[0-9a-f]{40}$ ]]; then echec "sha_attendu hors forme"; fi
          if [[ "$SHA_ATTENDU" == "$GITHUB_SHA" ]]; then :; else echec "sha_attendu différent du commit lancé"; fi
          version_psql=$(psql -X --version) || echec "psql introuvable"
          if [[ ! $version_psql =~ ^psql\ \(PostgreSQL\)\ (1[6-9]|[2-9][0-9])\. ]]; then echec "psql de version majeure inférieure à 16"; fi
          if [[ ! $PGHOST =~ ^[a-z0-9.-]{1,253}$ ]]; then echec "PGHOST hors forme"; fi
          if [[ $PGHOST == *-pooler* ]]; then echec "PGHOST désigne l'hôte poolé (hôte direct exigé)"; fi
          if [[ ! $PGDATABASE =~ ^[a-z0-9_]{1,63}$ ]]; then echec "PGDATABASE hors forme"; fi
          # Chiffrement (0056 § 2.6.2, amendé par 0067) : derrière le proxy de Neon, pg_stat_ssl du compute ne voit pas le
          # TLS du client ; la garantie est celle de libpq, qui refuse sous verify-full toute connexion sans TLS ou dont le
          # certificat ne nomme pas PGHOST. Seules les six variables PG* de l'étape (aucun PGSERVICE ni autre réglage hérité).
          if [[ "${!PG*}" != "PGDATABASE PGHOST PGPASSWORD PGSSLMODE PGSSLROOTCERT PGUSER" || $PGSSLMODE != verify-full || $PGSSLROOTCERT != system ]]; then echec "chiffrement : variables PG* hors liste, ou PGSSLMODE autre que verify-full"; fi

          motif_liste='^([0-9]{4}_[a-z0-9_]{1,60}) ([0-9a-f]{64})$'
          tags=()
          empreintes=()
          textes=()
          for ligne in "${MIGRATIONS_APPROUVEES[@]}"; do
            if [[ ! $ligne =~ $motif_liste ]]; then echec "ligne de la liste d'approbation hors forme"; fi
            tag=${BASH_REMATCH[1]}
            empreinte=${BASH_REMATCH[2]}
            f="$GITHUB_WORKSPACE/db/migrations/$tag.sql"
            chemin=$(realpath -e -- "$f") || echec "migration $tag absente"
            if [[ "$chemin" != "$f" ]]; then echec "migration $tag : lien symbolique"; fi
            if [[ ! -f $f || -L $f ]]; then echec "migration $tag : fichier non ordinaire"; fi
            taille=$(stat -c %s -- "$f") || echec "migration $tag : taille illisible"
            if [[ ! $taille =~ ^(0|[1-9][0-9]{0,8})$ ]]; then echec "migration $tag : taille illisible"; fi
            if [[ $taille == 0 ]]; then echec "migration $tag : fichier vide"; fi
            if [[ $taille -gt 102400 ]]; then echec "migration $tag : plus de 100 Kio"; fi
            if IFS= read -r -d '' texte < "$f"; then echec "migration $tag : octet NUL"; fi
            if [[ ${#texte} != "$taille" ]]; then echec "migration $tag : texte tronqué"; fi
            lue=$(printf '%s' "$texte" | sha256sum)
            lue=${lue%% *}
            if [[ "$lue" != "$empreinte" ]]; then echec "migration $tag : empreinte différente de la liste d'approbation"; fi
            if [[ $texte == '\'* ]]; then echec "migration $tag : commence par une barre oblique inverse"; fi
            if [[ ${texte,,} == *vadrouille_migrate.* ]]; then echec "migration $tag : nomme un paramètre vadrouille_migrate"; fi
            tags+=("$tag")
            empreintes+=("$empreinte")
            textes+=("$texte")
          done
          echo "Lignes de la liste d'approbation : ${#tags[@]}"
          if [[ ${#tags[@]} == 0 ]]; then
            echo "Aucune migration approuvée : aucune connexion."
            exit 0
          fi

          # 2 et 3. Connexion, rôle et journal, dans une première session (§ 2.6.2 et 2.6.3). Sortie dans un fichier
          # jamais affiché : une erreur de connexion nomme l'hôte.
          journal="$RUNNER_TEMP/db-migrate-journal.txt"
          traces="$RUNNER_TEMP/db-migrate-traces.txt"
          code=0
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -q -A -t -F '|' -c "$SQL_SESSION" -c "$SQL_ROLE" -c "$SQL_JOURNAL" -c "$SQL_LIRE_JOURNAL" > "$journal" 2> "$traces" || code=$?
          if [[ $code != 0 ]]; then
            etat=inconnu
            while IFS= read -r ligne; do
              if [[ $ligne =~ ^(ERROR|FATAL):\ +([0-9A-Z]{5})$ ]]; then etat=${BASH_REMATCH[2]}; fi
            done < "$traces"
            echec "connexion, rôle ou journal ; code de sortie $code ; SQLSTATE $etat"
          fi
          motif_journal='^([0-9]{4}_[a-z0-9_]{1,60})\|([0-9a-f]{64})$'
          journal_tags=()
          journal_empreintes=()
          while IFS= read -r ligne; do
            if [[ ! $ligne =~ $motif_journal ]]; then echec "ligne du journal hors forme"; fi
            journal_tags+=("${BASH_REMATCH[1]}")
            journal_empreintes+=("${BASH_REMATCH[2]}")
          done < "$journal"

          # Classement avant toute application : appliquée avec la même empreinte, ignorée ; avec une autre, échec.
          a_appliquer=()
          for i in "${!tags[@]}"; do
            etat=nouvelle
            for j in "${!journal_tags[@]}"; do
              if [[ "${journal_tags[$j]}" == "${tags[$i]}" ]]; then
                if [[ "${journal_empreintes[$j]}" == "${empreintes[$i]}" ]]; then etat=ignoree; else etat=modifiee; fi
              fi
            done
            if [[ $etat == modifiee ]]; then echec "migration ${tags[$i]} déjà appliquée avec une autre empreinte : écrire une nouvelle migration"; fi
            if [[ $etat == ignoree ]]; then echo "Ignorée (déjà appliquée) : ${tags[$i]}"; else a_appliquer+=("$i"); fi
          done

          # 4. Application, dans l'ordre de la liste : une session et une transaction par migration (§ 2.6.4).
          for i in "${a_appliquer[@]}"; do
            tag=${tags[$i]}
            non_appliquee=${SQL_NON_APPLIQUEE//@TAG@/$tag}
            inserer=${SQL_INSERER//@TAG@/$tag}
            inserer=${inserer//@SHA256@/${empreintes[$i]}}
            sortie="$RUNNER_TEMP/db-migrate-$tag.txt"
            code=0
            psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -c "$SQL_DELAIS" -c "BEGIN" -c "$SQL_VERROU" -c "$SQL_REPERE" -c "$non_appliquee" -c "${textes[$i]}" -c "$SQL_APRES_CHEMIN" -c "$SQL_APRES" -c "$inserer" -c "COMMIT" > "$sortie" 2>&1 || code=$?
            if [[ $code != 0 ]]; then
              etat=inconnu
              while IFS= read -r ligne; do
                if [[ $ligne =~ ^(ERROR|FATAL):\ +([0-9A-Z]{5})$ ]]; then etat=${BASH_REMATCH[2]}; fi
              done < "$sortie"
              echec "migration $tag ; code de sortie $code ; SQLSTATE $etat"
            fi
            echo "Appliquée : $tag"
          done
          echo "Terminé."
