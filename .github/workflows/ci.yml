name: ci
on: [pull_request]
# Moindre privilège : le jeton du workflow ne fait que lire le dépôt (revue de sécurité de #188).
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # B3a (décision 0050, P2 point 1) : environnement du serveur `ci` pour tout le job (build, e2e, tests de base).
    # Aucun secret de B3 n'est tiré ici ni écrit dans $GITHUB_ENV (0051 point 6.4.4) : playwright.config.ts et
    # scripts/test-db.mjs les tirent pour leur seul processus enfant.
    env:
      VADROUILLE_ENV: ci
    # Décision 0036, B1-TL-1 : `pnpm verify` appelle `pnpm test:db`, qui ne s'ignore jamais en CI (point 4 : base jetable).
    # Ce job a donc lui aussi sa base jetable ; le job `db` ci-dessous rejoue en plus amorçage et migrations.
    # Le job s'exécute sur la machine du runner, pas dans un conteneur : le port du service doit être publié pour être
    # joignable sur 127.0.0.1 (documentation GitHub, « Creating PostgreSQL service containers »).
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: vadrouille
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vadrouille"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Mailpit aussi : `pnpm verify` rejoue les tests de base de B3b-envoi (E5, E6, E8), qui ne s'ignorent jamais en CI.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        env:
          MP_DISABLE_VERSION_CHECK: "1"
        ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
        # Pas de `--health-cmd` : l'image (sans shell) porte son propre HEALTHCHECK `/mailpit readyz` en forme exec, qu'un
        # `--health-cmd` (forme shell) remplacerait par une commande introuvable ; seuls les délais sont ajustés.
        options: --health-interval 2s --health-timeout 5s --health-retries 30
    # Accès administrateur de la base jetable (PG*) : seulement dans les étapes qui en ont besoin, jamais au niveau du
    # job ni dans $GITHUB_ENV ; les étapes suivantes (Lighthouse, artefacts) ne le reçoivent pas.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: diff
        name: Détecter une PR de documentation seule
        # Branche de base passée par env, jamais interpolée dans le script (revue de sécurité de #188, mineur 5).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}"...HEAD > files.txt
          # Documentation seule (pas de tests) : STATUS, QUESTIONS, CLAUDE, LICENSE à la racine,
          # docs/, specs/, .claude/, et tout README*.md, à la racine ou dans un dossier.
          if grep -vqE '^((STATUS|QUESTIONS|CLAUDE|LICENSE)\.md|(.*/)?README[^/]*\.md)$|^(docs|specs|\.claude)/' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.diff.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - if: steps.diff.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.diff.outputs.code == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.diff.outputs.code == 'true'
        name: Préparer la base de test (amorçage, mots de passe jetables, migrations)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: vadrouille
        run: scripts/ci/db-setup.sh
      # `pnpm verify` appelle `pnpm test:db` (décision 0036, B1-TL-1) : l'adresse d'administration n'est posée que pour
      # cette étape. `next build` et les e2e, lancés par `pnpm verify`, la voient encore : sans mot de passe
      # (« trust »), elle ne donne rien de plus que le conteneur jetable joignable sur 127.0.0.1.
      - if: steps.diff.outputs.code == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: vadrouille
          VADROUILLE_DB_BOOTSTRAP_ROLE: postgres
        run: VADROUILLE_DB_ADMIN_URL="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}" pnpm verify
      # Mesure Lighthouse (décision 0022 § 1 et § 2) : réutilise le build de `pnpm verify`, aucun service externe.
      - if: steps.diff.outputs.code == 'true'
        name: Mesurer avec Lighthouse
        run: E2E_SKIP_BUILD=1 pnpm test:perf
      - if: always() && steps.diff.outputs.code == 'true'
        name: Envoyer les rapports Lighthouse en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure() && steps.diff.outputs.code == 'true'
        name: Envoyer les résultats de test en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  # Spécification B1 : base de référence des tests de base (décision B1-PO-1). Conteneur postgres:17.11 jetable,
  # amorçage avec l'utilisateur administrateur du conteneur, migrations sous vadrouille_migrator (deux fois : la
  # seconde ne fait rien), puis `pnpm test:db`, dont chaque test se connecte avec le rôle qu'il éprouve.
  db:
    runs-on: ubuntu-24.04
    # B3a (décision 0050, P2 point 1) : environnement `ci` ; le secret du limiteur vient de scripts/test-db.mjs.
    env:
      VADROUILLE_ENV: ci
    # Port publié : nécessaire pour joindre le service sur 127.0.0.1 depuis la machine du runner (voir job verify).
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: vadrouille
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vadrouille"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # B3b-envoi (spécification B3b-envoi, point 1 ; B3-TL-8 ; décision 0098 § 5) : Mailpit, la boîte qui reçoit les e-mails
      # du code (jamais d'envoi réel). Même image, même digest que `docker-compose.yml` (décision 0008). Aucune option de
      # relais (`MP_SMTP_RELAY_*` absentes), aucun secret, aucun volume (base temporaire), aucune commande : la seule
      # variable est `MP_DISABLE_VERSION_CHECK` (aucune requête vers GitHub). SMTP (1025) et API (8025) publiés sur la boucle
      # locale du runner seulement : l'interface n'a pas d'authentification.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        env:
          MP_DISABLE_VERSION_CHECK: "1"
        ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
        # Pas de `--health-cmd` : l'image (sans shell) porte son propre HEALTHCHECK `/mailpit readyz` en forme exec, qu'un
        # `--health-cmd` (forme shell) remplacerait par une commande introuvable ; seuls les délais sont ajustés.
        options: --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: diff
        name: Détecter une PR de documentation seule
        # Branche de base passée par env, jamais interpolée dans le script (revue de sécurité de #188, mineur 5).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}"...HEAD > files.txt
          # Documentation seule (pas de tests) : STATUS, QUESTIONS, CLAUDE, LICENSE à la racine,
          # docs/, specs/, .claude/, et tout README*.md, à la racine ou dans un dossier.
          if grep -vqE '^((STATUS|QUESTIONS|CLAUDE|LICENSE)\.md|(.*/)?README[^/]*\.md)$|^(docs|specs|\.claude)/' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.diff.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - if: steps.diff.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.diff.outputs.code == 'true'
        name: Amorçage et migrations, deux fois chacun
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: vadrouille
          EXPECTED_SERVER_VERSION: "17.11"
        run: scripts/ci/db-setup.sh --twice
      # Refus de SKIP_DB_TESTS en CI : un seul endroit, scripts/test-db.mjs (testé dans tests/unit/db/).
      - if: steps.diff.outputs.code == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: vadrouille
          VADROUILLE_DB_BOOTSTRAP_ROLE: postgres
        run: VADROUILLE_DB_ADMIN_URL="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}" pnpm test:db
      # B3c (spécification B3, B3c point 7 ; B3-TL-8 ; décision 0077 § 5.4) : projet Playwright `auth`, serveur construit
      # avec `AUTH_ADAPTER=better-auth` sur cette base migrée. `E2E_AUTH_SERVER=1` (variable d'outillage) démarre ce
      # serveur ; ses deux secrets sont tirés par playwright.config.ts, jamais ici. Ni adresse d'administration ni PG*.
      - if: steps.diff.outputs.code == 'true'
        name: Installer Chromium pour le projet auth
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.diff.outputs.code == 'true'
        name: Construire le serveur du projet auth
        run: pnpm build
      - if: steps.diff.outputs.code == 'true'
        name: Projet Playwright auth (redirection sans session)
        run: E2E_SKIP_BUILD=1 E2E_AUTH_SERVER=1 pnpm exec playwright test --project=auth
      - if: failure() && steps.diff.outputs.code == 'true'
        name: Envoyer les résultats du projet auth en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-auth
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: diff
        # Branche de base passée par env, jamais interpolée dans le script (revue de sécurité de #188, mineur 5).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}"...HEAD > files.txt
          # Documentation seule (pas de tests) : STATUS, QUESTIONS, CLAUDE, LICENSE à la racine,
          # docs/, specs/, .claude/, et tout README*.md, à la racine ou dans un dossier.
          if grep -vqE '^((STATUS|QUESTIONS|CLAUDE|LICENSE)\.md|(.*/)?README[^/]*\.md)$|^(docs|specs|\.claude)/' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.code == 'true'
        run: docker build -t app:ci .
      - if: steps.diff.outputs.code == 'true'
        name: Démarrer l'image et vérifier le port 3000
        run: |
          docker run -d --name app -p 3000:3000 app:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/ || { docker logs app; exit 1; }
          # Pages de développement désactivées en production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/tokens)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/composants)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/carte)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/voyages/mock_trip_edimbourg)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/voyages/mock_trip_edimbourg/jour/2)" = "404"
          # F8b : écran 3 avec la carte simulée (`R3-dev`, décision 0017 § 11.3).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/voyages/nouveau/logement)" = "404"
          # Paiement simulé fermé dans l'image de production (F9-PO-19, décision 0020 § 5).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/voyages/mock_trip_edimbourg/debloquer)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/voyages/mock_trip_edimbourg/debloquer/paiement-simule/AAAAAAAAAAAAAAAAAAAAAA)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/voyages/mock_trip_edimbourg/debloquer/confirmation?paiement=AAAAAAAAAAAAAAAAAAAAAA')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'x-vadrouille-simulation: ci' -d '{"action":"advanceClock","ms":0}' http://127.0.0.1:3000/dev/api/simulation)" = "404"
          if curl -fsS http://127.0.0.1:3000/ | grep -q '/debloquer'; then echo "lien Débloquer sur l'accueil"; exit 1; fi
          # Webhook simulé fermé dans l'image de production, sans drapeau (spécification B4, A10 ; décision 0097 B4-TL-7
          # et B4-TL-11) : 404 au POST d'un corps JSON, avant toute lecture du corps.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/v1/webhooks/simulated)" = "404" || { docker logs app; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/etats)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dev/etats/erreur)" = "404"
          docker rm -f app
          # Adaptateur prototype refusé dans l'image (VADROUILLE_ENV=production), même avec le drapeau de CI
          # (spécification P0, P0b1 ; décision 0032 § A4.4) : erreur 500 explicite, ni section « Prototype » ni
          # programme. Attente d'un code HTTP quelconque (pas `curl -f` : la réponse attendue est un 500).
          docker run -d --name app-prototype -p 3002:3000 -e DATA_ADAPTER=prototype app:ci
          docker run -d --name app-prototype-drapeau -p 3003:3000 -e DATA_ADAPTER=prototype -e VADROUILLE_PROTOTYPE=1 -e CI=true app:ci
          # Le 500 doit venir de la garde : son message est exigé dans les journaux du conteneur.
          for cible in app-prototype:3002 app-prototype-drapeau:3003; do
            name="${cible%%:*}"
            port="${cible##*:}"
            for i in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")" != "000" ]; then break; fi
              sleep 1
            done
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")" = "500" || { docker logs "$name"; exit 1; }
            body="$(curl -s "http://127.0.0.1:$port/")"
            if printf '%s' "$body" | grep -q 'Prototype'; then echo "section Prototype servie par l'image (port $port)"; exit 1; fi
            if printf '%s' "$body" | grep -q 'proto_'; then echo "programme du prototype servi par l'image (port $port)"; exit 1; fi
            docker logs "$name" 2>&1 | grep -q 'adaptateur prototype refusé' || { echo "500 sans le refus de la garde ($name)"; docker logs "$name"; exit 1; }
          done
          docker rm -f app-prototype app-prototype-drapeau
      # Décision 0017 § 11.0 et § 11.3 (F8b), amendant 0020 § 5 (F9a) : VADROUILLE_ENV=production, porté par l'image,
      # ferme les pages de développement, la portée des simulations, la connexion et le paiement simulés, même avec
      # les drapeaux d'ouverture. Drapeaux passés en `-e` au seul conteneur vérifié : ni clé `env:`, ni `export`
      # (seule exception de configuration versionnée, tests/unit/dev-pages-env.test.ts).
      - if: steps.diff.outputs.code == 'true'
        name: Gardes fermées malgré les drapeaux
        run: |
          docker run -d --name app-drapeau -p 3001:3000 -e VADROUILLE_DEV_PAGES=1 -e VADROUILLE_DEMO_AUTH=1 -e VADROUILLE_DEMO_PAYMENT=1 app:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3001/ || { docker logs app-drapeau; exit 1; }
          # R3-dev : pages de développement et connexion simulée.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/dev/voyages/nouveau/logement)" = "404" || { docker logs app-drapeau; exit 1; }
          # R-sim, corps valide et portée explicite : portée des simulations.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'x-vadrouille-simulation: ci-gardes' -d '{"action":"advanceClock","ms":0}' http://127.0.0.1:3001/dev/api/simulation)" = "404" || { docker logs app-drapeau; exit 1; }
          # R9 : paiement simulé.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/voyages/mock_trip_edimbourg/debloquer)" = "404" || { docker logs app-drapeau; exit 1; }
          if curl -fsS http://127.0.0.1:3001/ | grep -q '/debloquer'; then echo "lien Débloquer sur l'accueil"; exit 1; fi
          docker rm -f app-drapeau
      # B3a (spécification B3, B3a point 3 ; décisions 0050, P2 point 3, et 0051, points 2 et 6.4) : l'image refuse de
      # démarrer sur une configuration refusée. Chaque cas exige l'arrêt du conteneur avec un code non nul en moins de
      # 30 secondes, un journal qui nomme la variable, et l'absence de la sentinelle dans ce journal. Aucune commande ne
      # passe VADROUILLE_ENV, VERCEL_ENV ni VERCEL (l'image reste fermée par sa seule ligne VADROUILLE_ENV=production).
      - if: steps.diff.outputs.code == 'true'
        name: Gardes de configuration de l'image
        run: |
          sentinelle="$(openssl rand -hex 12)"
          verifier() {
            nom="$1"
            variable="$2"
            shift 2
            docker run -d --name "$nom" "$@" app:ci > /dev/null
            code=""
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$nom")" = "false" ]; then
                code="$(docker inspect -f '{{.State.ExitCode}}' "$nom")"
                break
              fi
              sleep 1
            done
            journal="$(docker logs "$nom" 2>&1)"
            docker rm -f "$nom" > /dev/null
            test -n "$code" || { echo "$nom : conteneur encore démarré après 30 secondes"; exit 1; }
            test "$code" != "0" || { echo "$nom : code de sortie nul"; exit 1; }
            printf '%s' "$journal" | grep -qF "\"variable\":\"$variable\"" || { echo "$nom : journal sans la variable $variable"; exit 1; }
            if printf '%s' "$journal" | grep -qF "$sentinelle"; then echo "$nom : sentinelle dans le journal"; exit 1; fi
          }
          # En-tête dont l'élément de gauche est choisi par le client : refusé partout (untrusted_header).
          verifier gardes-entete-xff TRUSTED_IP_HEADER -e "TRUSTED_IP_HEADER=x-forwarded-for"
          # En-tête de Vercel hors de Vercel (image Docker) : refusé (header_outside_vercel).
          verifier gardes-entete-vercel TRUSTED_IP_HEADER -e "TRUSTED_IP_HEADER=x-vercel-forwarded-for"
          # Clé Stripe de production : refusée dans tous les environnements (production_prefix).
          verifier gardes-stripe STRIPE_SECRET_KEY -e "STRIPE_SECRET_KEY=sk_live_${sentinelle}"
          # Webhook simulé ouvert par son drapeau dans l'image de production : refusé (forbidden ; spécification B4, A10 ;
          # décision 0097 B4-TL-7). Seule ligne de configuration versionnée qui nomme ce drapeau (A26, exception de
          # B4-TL-8, tests/unit/debloquer-regles.test.ts) ; le secret de signature n'est jamais nommé ici.
          verifier gardes-webhook-simule SIMULATED_WEBHOOK_ENABLED -e "SIMULATED_WEBHOOK_ENABLED=true"
