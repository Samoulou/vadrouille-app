name: auto-merge
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.label.name == 'needs-review' || github.event.label.name == 'docs-only'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR" --repo "$REPO"
        env:
          # Une fusion faite avec GITHUB_TOKEN ne ferme pas les tickets « Closes #n »
          # et ne supprime pas la branche : jeton dédié s'il existe (#176).
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
