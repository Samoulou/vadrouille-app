# Base locale (décisions 0002 et 0006, spécification B1) : portabilité et postes qui disposent de Docker. Personne
# n'est tenu de l'exécuter : la base de référence est le conteneur de la CI (job « db », décision B1-PO-1).
# Aucun mot de passe : authentification « trust », port lié à la boucle locale seulement. Voir db/README.md.
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: vadrouille
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vadrouille"]
      interval: 2s
      timeout: 5s
      retries: 30
